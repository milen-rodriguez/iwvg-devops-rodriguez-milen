name: cd-main.yml
on:
  push:
    branches: ['main']

env:
  REPOSITORY: ${{ github.repository }} # <user>/<repo>
  GHCR_URL: ghcr.io # GitHub Container Registry
  ARTIFACT: iwvg-devops-rodriguez-milen


jobs:
  cd-staging:
    name: Deploy to AWS
    environment: prod

    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🏷️ Extract artifact from pom
        run: |
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:latest
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:staging
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:staging-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 🚀 Deploy on AWS Ligthsail
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{secrets.AWS_LIGHTSAIL_IP_MAIN}}
          username: ${{secrets.AWS_LIGHTSAIL_USER_MAIN}}
          key: ${{secrets.AWS_LIGHTSAIL_SSH_KEY_MAIN}}
          script: |
            echo ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker pull ghcr.io/${{ env.REPOSITORY }}:latest
            docker rm -f ${{ env.ARTIFACT }} || true
            docker run -d \
              --name ${{ env.ARTIFACT }} \
              --restart always \
              --memory 512m \
              --memory-swap 1024m \
              --network devops \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e PRODUCTION_DB_URL="${{ secrets.PRODUCTION_DB_URL }}" \
              -e PRODUCTION_DB_USER="${{ secrets.PRODUCTION_DB_USER }}" \
              -e PRODUCTION_DB_PASSWORD="${{ secrets.PRODUCTION_DB_PASSWORD }}" \
              ghcr.io/${{ env.REPOSITORY }}:latest
            
            echo "⏳ Esperando a que se levante"
            for i in $(seq 1 12); do
              sleep 15
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' ${{ env.ARTIFACT }} 2>/dev/null)
              echo "Intento $i: $STATUS"
              [ "$STATUS" = "healthy" ] && break
            done
            
            if [ "$STATUS" != "healthy" ]; then
              echo "❌ Deploy fallido"
              docker logs --tail 50 ${{ env.ARTIFACT }}
              exit 1
            fi
            
            echo "✅ Deploy exitoso"
            docker image prune --filter "until=12h" -f